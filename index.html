<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacy guard: the page may not make fetch/XHR/beacon/WebSocket requests at all.
       (The service worker has its own context and only caches this app's own files.) -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Health Log">
  <meta name="description" content="Personal health log. Your data stays on this device.">
  <title>Health Log</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <!-- The manifest link is added by js/app.js only over http(s), so file:// shows no error. -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/charts.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <h1 id="screen-title">Today</h1>
    <div id="save-status" class="save-status" role="status" aria-live="polite"></div>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p>This app needs JavaScript turned on.</p></noscript>
    <p class="placeholder" id="boot-msg">Loading&hellip;</p>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/></svg>
      <span>Today</span>
    </a>
    <a href="#history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>History</span>
    </a>
    <a href="#trends" data-tab="trends">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      <span>Trends</span>
    </a>
    <a href="#patterns" data-tab="patterns">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="9" cy="17" r="2"/><circle cx="17" cy="18" r="2"/><path d="M8 7l8 1M7 8l2 7M11 17h4"/></svg>
      <span>Patterns</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Classic scripts, loaded in order, one global namespace (window.HT) so the app
       also runs from file:// where ES modules are blocked in some browsers.
       Optional modules (import-health.js, trends.js, patterns.js) are loaded by app.js
       and the app runs without them. -->
  <script src="js/units.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/db.js"></script>
  <script src="js/caffeine-core.js"></script>
  <script src="js/caffeine-ui.js"></script>
  <script src="js/today.js"></script>
  <script src="js/history.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/health-dates.js"></script>
  <script src="js/health-zip.js"></script>
  <script src="js/health-scan.js"></script>
  <script src="js/health-agg.js"></script>
  <script src="js/health-csv.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
